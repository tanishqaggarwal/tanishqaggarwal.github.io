<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f0e2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>One year together</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffc53d' stroke='%232a241e' stroke-width='2'/%3E%3Ccircle cx='12.5' cy='15' r='1.2' fill='%232a241e'/%3E%3Ccircle cx='19.5' cy='15' r='1.2' fill='%232a241e'/%3E%3Cpath d='M12 18.5 Q16 22 20 18.5' fill='none' stroke='%232a241e' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,400;0,600;0,700;1,500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <div id="safe-probe" aria-hidden="true"></div>
  <svg class="grain" aria-hidden="true">
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#paper-grain)"/>
  </svg>

  <main class="stage is-intro" id="stage">
    <div class="sky">
      <svg id="scene" viewBox="0 0 800 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A smiling sun. After you begin, the Earth travels its orbit from memory to memory."></svg>
    </div>

    <div class="slot" id="title-slot">
      <h1 class="chrome-pop" id="title"></h1>
    </div>

    <div class="slot" id="remember-slot">
      <form class="remember-row chrome-pop" id="remember-form" autocomplete="off">
        <input class="password" id="password" type="password" name="password" autocomplete="current-password" placeholder="Password" aria-label="Password" spellcheck="false" autocapitalize="off">
        <button type="submit" class="btn" id="remember">Let's Remember</button>
        <p class="password-hint" id="password-hint" role="alert"></p>
      </form>
    </div>

    <section class="story" id="story" hidden>
      <div class="story-card">
      <div class="story-scroll" id="story-scroll">
      <p class="date-line step" id="date-line" aria-live="polite"></p>
      <p class="blurb step" id="blurb"></p>
      <figure class="step" id="polaroid">
        <div class="polaroid-card" id="polaroid-card">
          <div class="tape" aria-hidden="true"></div>
          <div class="frame" id="frame">
            <img id="photo" alt="" hidden draggable="false">
            <div class="empty-photo" id="empty-photo" aria-hidden="true"></div>
          </div>
          <figcaption id="caption"></figcaption>
          <div class="photo-nav" id="photo-nav" hidden>
            <button type="button" class="photo-arrow" id="photo-prev" aria-label="Previous picture">‹</button>
            <div class="photo-dots" id="photo-dots"></div>
            <button type="button" class="photo-arrow" id="photo-next" aria-label="Next picture">›</button>
          </div>
        </div>
      </figure>
      </div>
      <div class="actions step" id="actions">
        <button type="button" class="btn" id="next">Fly to the next one</button>
        <button type="button" class="btn" id="again" hidden>One more time</button>
      </div>
      </div>
    </section>
  </main>

  <noscript>
    <p class="noscript">This little solar system needs JavaScript to turn.</p>
  </noscript>
  <script type="module" src="main.js?v=9"></script>
</body>
</html>
